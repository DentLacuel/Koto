
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil | Koto</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/logo/koto-logo-01.png">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">

            <a href="index.html" class="navbar-logo">Koto</a>

            <button class="navbar-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="navbar-menu">
                <li><a href="discover.html">Découvrir</a></li>
                <li><a href="create-listing.html">Publier une annonce</a></li>
                <li><a href="#comment-ca-marche">Comment ça marche</a></li>
                <li><a href="profile.html" class="active">Profil</a></li>
                <li><a href="login.html">Connexion</a></li>
            </ul>

        </div>
    </nav>

    <main class="profile-container">

        <h1 id="connexionProfile">Mon profil</h1><br><br>
        <section class="my-listings-section">

            <h2>Mes annonces</h2><br><br>
            
            <p id="profile-status" aria-live="polite">
                Chargement de vos annonces...
            </p>

            <div id="my-listings-grid" class="my-listings-grid">
                <!-- Les annonces seront ajoutées ici par profile.js -->
            </div>
        </section>

        <dialog id="edit-listing-dialog" class="edit-listing-dialog">

    <div class="edit-listing-header">
        <h2>Modifier mon annonce</h2><br>
        <button
            type="button"
            id="close-edit-dialog"
            aria-label="Fermer"
        >
            &times;
        </button>
    </div>

    <form id="edit-listing-form">

        <label for="edit-title">Titre</label>
        <input
            type="text"
            id="edit-title"
            maxlength="150"
            required
        >

        <label for="edit-description">Description</label>
        <textarea
            id="edit-description"
            required
        ></textarea>

        <label for="edit-price">Prix ($)</label>
        <input
            type="number"
            id="edit-price"
            min="0"
            step="0.01"
            required
        >

        <label for="edit-category">Catégorie</label>
        <select id="edit-category" required>
            <option value="">Chargement des catégories...</option>
        </select>

        <label for="edit-location">Localisation</label>
        <input
            type="text"
            id="edit-location"
            required
        >

        <div class="edit-photos-section"><br>
            <h3>Photos actuelles</h3><br>
            <div id="edit-existing-photos"></div>

            <label for="edit-photos">Ajouter des photos</label>
            <input
                type="file"
                id="edit-photos"
                accept="image/jpeg,image/png,image/webp"
                multiple
            >

            <div id="edit-photo-preview"></div>

            <p id="edit-photo-status" aria-live="polite"></p>
        </div>

        <p id="edit-form-status" aria-live="polite"></p>

        <div class="edit-form-actions">
            <button type="button" id="cancel-edit">
                Annuler
            </button>

            <button type="submit" id="save-edit"><br>
                Enregistrer les modifications
            </button>
        </div>

    </form>

</dialog>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-ui.js"></script>
    <script src="script.js"></script>
    <script src="profile.js"></script>

</body>
</html>
