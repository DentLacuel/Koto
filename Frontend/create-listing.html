
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier une annonce | Koto</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="create-listing.css">
</head>

<body>

     <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">Koto</a>

            <button class="navbar-toggle" aria-label="Ouvrir le menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="navbar-menu">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="discover.html">Découvrir</a></li>
                <li><a href="#">Catégories</a></li>
                <li><a href="#">Comment ça marche</a></li>
                <li><a href="create-listing.html"  class="active">Publier une annonce</a></li>
                 <li><a href="login.html">Connexion</a></li>
            </ul>
        </div>
    </nav>

    <main class="create-listing-container">

        <header>
            <h1>Publier une annonce</h1>
            <p>Présentez votre article à la communauté Koto.</p>
        </header>

        <form id="listing-form">

            <div class="form-group">
                <label for="title">Titre de l'annonce</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="price">Prix ($)</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    max="9999.99"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Catégorie</label>
                <select id="category" name="category_id" required>
                    <option value="">Chargement des catégories...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">Localisation</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="photos">Photos</label>
                <input
                    type="file"
                    id="photos"
                    name="photos"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                >
                <div id="photo-preview"></div>
            </div>

            <button type="submit">Publier l'annonce</button>

        </form>

    </main>

    <!-- Bibliothèque Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Configuration Supabase -->
<script src="supabase-config.js"></script>

<!-- Logique du formulaire -->
<script src="create-listing.js"></script>

<!-- Scripts pour Hamburger-->
<script src="script.js"></script>

</body>
</html>
