
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Découvrir | Koto</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="discover.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">Koto-listing</a>

            <button class="navbar-toggle" aria-label="Ouvrir le menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="navbar-menu">
              <!-- <li><a href="index.html">Accueil</a></li> -->
                <li><a href="discover.html" class="active">Découvrir</a></li>
                <li><a href="create-listing.html">Publier une annonce</a></li>
                <li><a href="howToUse.html">Comment ça marche</a></li>
                <li><a href="profile.html">Profil</a></li>
                 <li><a href="login.html">Connexion</a></li>
            </ul>
        </div>
    </nav>

    <main class="discover-container">

        <header class="discover-header">
            <h1>Découvrir</h1>
            <p>Découvrez des articles près de chez vous.</p>
        </header>

        <section class="discover-filters">
            <input
                type="search"
                id="search-input"
                placeholder="Rechercher un article..."
            >

            <select id="category-filter">
                <option value="">Toutes les catégories</option>
            </select>
        </section>

        <section>
            <div id="listings-grid" class="listings-grid">
                <p>Chargement des annonces...</p>
            </div>
        </section>

    </main>


    <!-- Fenêtre d'affichage agrandi des photos -->
    <dialog id="photo-lightbox" class="photo-lightbox">

        <div class="lightbox-content">

            <!-- Bouton de fermeture -->
            <button
                type="button"
                id="lightbox-close"
                class="lightbox-close"
                aria-label="Fermer la photo"
            >
                &times;
            </button>

            <!-- Photo agrandie -->
            <img
                id="lightbox-image"
                src=""
                alt="Photo agrandie de l'annonce"
            >

            <!-- Navigation entre les photos -->
            <div class="lightbox-controls">

                <button
                    type="button"
                    id="lightbox-prev"
                    aria-label="Photo précédente"
                >
                    &#10094;
                </button>

                <span id="lightbox-counter">1 / 1</span>

                <button
                    type="button"
                    id="lightbox-next"
                    aria-label="Photo suivante"
                >
                    &#10095;
                </button>

            </div>

        </div>

    </dialog>


    <!-- Bibliothèque Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration Supabase -->
    <script src="supabase-config.js"></script>
    <script src="auth-ui.js"></script>
    <script src="script.js"></script>
    <script src="discover.js"></script>
</body>
</html>
