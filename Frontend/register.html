 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte | Koto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">Koto-listing</a>

            <button class="navbar-toggle" aria-label="Ouvrir le menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="navbar-menu">
                <li><a href="discover.html">Découvrir</a></li>
                <li><a href="create-listing.html">Publier une annonce</a></li>
                <li><a href="howToUse.html">Comment ça marche</a></li>
                <li><a href="profile.html">Profil</a></li>
                <li><a href="login.html" class="active">Connexion</a></li>
            </ul>
        </div>
    </nav>

    <main class="auth-container"><br>
        <h1>Créer un compte Koto</h1><br>
        <p>Rejoignez la communauté Koto.</p><br>

        <form id="register-form">

            <label for="first-name">Prénom</label>
            <input type="text" id="first-name" required><br><br>

            <label for="last-name">Nom</label>
            <input type="text" id="last-name" required><br><br>

            <label for="email">Adresse courriel</label>
            <input type="email" id="email" required><br><br>

            <label for="university">Université (facultatif)</label>
            <input type="text" id="university"><br><br>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" minlength="8" required><br><br>

            <button type="submit">Créer mon compte</button>

            <p id="register-message"></p><br><br>
        </form>

        <p>Déjà membre ? <a href="login.html">Se connecter</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="register.js"></script>

    <!-- Scripts pour Hamburger-->
    <script src="script.js"></script>

</body>
</html>
