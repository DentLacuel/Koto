
name: Koto CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests backend
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test

  frontend-check:
    name: Vérification frontend
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les fichiers essentiels
        run: |
          test -f Frontend/index.html
          test -f Frontend/style.css

  deploy:
    name: Déploiement Render
    needs: [test, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Déployer le backend
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Déployer le frontend
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
